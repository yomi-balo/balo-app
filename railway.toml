# Railway service configuration for balo-app API
#
# Railway has deprecated Config as Code and stops reading this file on 2026-12-01. Every setting
# below (the pre-deploy migration included) must move to Railway's Infrastructure as Code,
# checked in, before then, or it silently stops applying. If any go to the dashboard instead,
# keep TZ/NODE_ENV inline in the start command, never as service variables (see below).
[build]
buildCommand = "pnpm install --frozen-lockfile && pnpm build --filter api"

[deploy]
# TZ=UTC pins the process timezone: the availability resolver iterates local-midnight
# Date objects (getDay()/setDate()), which are only correct when the server runs UTC.
#
# NODE_ENV=production is pinned HERE, in checked-in config, rather than left to a Railway
# dashboard variable. `apps/api`'s start path is a bare `node dist/index.js` (unlike
# `apps/web`, where `next start` sets NODE_ENV itself), and `app.ts`'s dev-route gate is
# `if (process.env.NODE_ENV !== 'production')` — which FAILS OPEN on an unset variable and
# would register the BAL-239 seed routes on the deployed API. BAL-428 is what made that
# matter: `truncateSeedData` now hard-deletes meetings, engagements, transcripts,
# meeting_guests and audit rows that were not in its blast radius before. Do not remove
# this without closing that gate some other way.
startCommand = "TZ=UTC NODE_ENV=production node apps/api/dist/index.js"
# Apply pending Drizzle migrations before the new build takes traffic. `drizzle-kit migrate`
# applies every pending journal entry in ONE transaction and records each in
# `drizzle.__drizzle_migrations`. A failing migration rolls the whole batch back and fails the
# deploy, so the previous build keeps serving. A migration that succeeds is never undone, even
# when the new build then fails its healthcheck, so the previous build must keep working on the
# migrated schema: expand/contract (CLAUDE.md, Database). Vercel deploys apps/web on its own
# schedule, so a new web build can also run against the old schema until this step commits; that
# gap is open (recorded on BAL-307).
#
# drizzle-kit connects with the MIGRATION_DATABASE_URL service variable: Supabase's session
# pooler (DATABASE_URL's host, port 5432) or a direct connection. drizzle.config.ts refuses the
# transaction pooler (:6543) the API connects through rather than fall back to it; see
# packages/db/src/migration-database-url.ts. drizzle-kit is a runtime dependency of @balo/db so
# this step survives dev-dependency pruning. The command stays shell-free because Railway does
# not document whether a pre-deploy command runs through a shell.
preDeployCommand = "pnpm --filter @balo/db db:migrate"
# Without a cap, a migration waiting on a lock holds the deploy "in progress" indefinitely.
preDeployTimeoutSeconds = 600
numReplicas = 1
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
